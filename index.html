<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Table</title>
    <link rel="stylesheet" href="styles.css"> <!-- Assuming there's a styles CSS for dark theme -->
    <script>
        let data = [];

        window.onload = function() {
            fetch('FP_BACKUP_20.03.26.json')
                .then(response => response.json())
                .then(jsonData => {
                    data = jsonData;
                    displayData();
                })
                .catch(error => console.error('Error loading the JSON file:', error));
        };

        function displayData() {
            const tableBody = document.getElementById('data-table-body');
            tableBody.innerHTML = '';

            data.forEach((item, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `<td>${item.name}</td><td>${item.value}</td>`;
                row.onclick = () => toggleDetails(index);
                tableBody.appendChild(row);

                const detailRow = document.createElement('tr');
                detailRow.className = 'detail-row hidden';
                detailRow.innerHTML = `<td colspan="2">${JSON.stringify(item.details)}</td>`;
                tableBody.appendChild(detailRow);
            });
        }

        function toggleDetails(index) {
            const detailRows = document.querySelectorAll('.detail-row');
            detailRows[index].classList.toggle('hidden');
        }

        function downloadAsWord() {
            let table = document.getElementById("data-table").outerHTML;
            let blob = new Blob(['\ufeff', table], {
                type: 'application/msword'
            });
            let url = URL.createObjectURL(blob);
            let anchor = document.createElement('a');
            anchor.href = url;
            anchor.download = 'data_table.doc';
            anchor.click();
            URL.revokeObjectURL(url);
        }
    </script>
</head>
<body>
    <table id="data-table">
        <thead>
            <tr>
                <th>Name</th>
                <th>Value</th>
            </tr>
        </thead>
        <tbody id="data-table-body">
            <!-- Fetched data will be injected here -->
        </tbody>
    </table>
    <button onclick="downloadAsWord()">Download as Word</button>
</body>
</html>
